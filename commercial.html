<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#2d3480">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <title>SOGM — Prise de commande</title>
  <link rel="icon" type="image/png" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="com-page">
  <header class="topbar">
    <div class="tb-left"><img src="img/logo-sm.png" class="tb-logo" alt="SO.G.M"> <span class="muted" id="userName"></span></div>
    <nav class="tabs">
      <button class="tab active" data-view="new">🛒 Nouvelle commande</button>
      <button class="tab" data-view="mine">📋 Mes commandes</button>
    </nav>
    <button class="btn btn-light btn-sm" id="logoutBtn">Déconnexion</button>
  </header>

  <!-- Vue : nouvelle commande -->
  <section id="view-new" class="view active">
    <!-- Commande en cours : reste en haut jusqu'à l'enregistrement -->
    <div class="order-panel" id="orderPanel">
      <div class="client-bar">
        <label class="client-select">
          <span>Client</span>
          <select id="clientSelect"></select>
        </label>
        <button class="btn btn-secondary" id="newClientBtn">＋ Nouveau client</button>
      </div>
      <div class="order-lines-head">
        <span>Produit</span><span>Sac</span><span class="r">Qté</span><span class="r">Montant</span><span></span>
      </div>
      <div class="order-lines" id="orderLines"></div>
      <div class="order-foot">
        <div class="order-total"><span id="lineCount">0 produit</span> • <span id="sacCount">Qté totale : 0</span>
          <b id="orderTotal">0,00 DH</b></div>
        <button class="btn btn-light" id="clearBtn">Vider</button>
        <button class="btn btn-primary btn-lg" id="saveBtn">✔ Enregistrer la commande</button>
      </div>
    </div>

    <div class="client-hint" id="clientHint">👆 Sélectionnez d'abord le client pour pouvoir choisir les produits.</div>

    <div class="filters">
      <input type="search" id="search" placeholder="🔍 Rechercher un produit…">
      <div class="chips" id="catChips"></div>
    </div>

    <div class="product-grid" id="productGrid"></div>
  </section>

  <!-- Vue : mes commandes -->
  <section id="view-mine" class="view">
    <div class="list-head">
      <h2>Mes commandes</h2>
      <select id="mineFilter">
        <option value="">Tous les statuts</option>
        <option value="attente">En attente</option>
        <option value="validee">Validées</option>
        <option value="chargement">Au chargement</option>
        <option value="chargee">Chargées</option>
        <option value="livree">Livrées</option>
        <option value="annulee">Annulées</option>
      </select>
    </div>
    <div id="fbMine"></div>
    <div id="myOrders" class="order-cards"></div>
  </section>

  <script src="js/store.js"></script>
  <script src="js/commercial.js"></script>
</body>
</html>
